name: presenta-stage-3d

services:
  web:
    image: node:24-bookworm
    container_name: presenta-stage-3d-web
    working_dir: /app
    command: bash -lc "npm ci && npm run dev -- --host 0.0.0.0 --force"
    ports:
      - "${PRESENTA_WEB_PORT:-5174}:5173"
    volumes:
      - ..:/app
      - presenta-stage-3d-web-node-modules:/app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy
      api:
        condition: service_started

  api:
    image: node:24-bookworm
    container_name: presenta-stage-3d-api
    working_dir: /app
    command: bash -lc "npm ci && npm run api"
    environment:
      PRESENTA_API_PORT: "8787"
      PRESENTA_DB_HOST: mariadb
      PRESENTA_DB_PORT: "3306"
      PRESENTA_DB_NAME: "${PRESENTA_DB_NAME:-presenta_stage_3d}"
      PRESENTA_DB_USER: "${PRESENTA_DB_USER:-presenta}"
      PRESENTA_DB_PASSWORD: "${PRESENTA_DB_PASSWORD:-presenta-local-password}"
    volumes:
      - ..:/app
      - presenta-stage-3d-api-node-modules:/app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    container_name: presenta-stage-3d-mariadb
    restart: unless-stopped
    ports:
      - "${PRESENTA_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: "${PRESENTA_DB_NAME:-presenta_stage_3d}"
      MARIADB_USER: "${PRESENTA_DB_USER:-presenta}"
      MARIADB_PASSWORD: "${PRESENTA_DB_PASSWORD:-presenta-local-password}"
      MARIADB_ROOT_PASSWORD: "${PRESENTA_DB_ROOT_PASSWORD:-presenta-root-local-password}"
    volumes:
      - presenta-stage-3d-mariadb-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  presenta-stage-3d-web-node-modules:
    name: presenta-stage-3d-web-node-modules
  presenta-stage-3d-api-node-modules:
    name: presenta-stage-3d-api-node-modules
  presenta-stage-3d-mariadb-data:
    name: presenta-stage-3d-mariadb-data
